<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Issue / Return - ECE Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        .highlight-anim {
            animation: highlight 0.5s ease-out;
        }
        @keyframes highlight {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); background: rgba(16, 185, 129, 0.2); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); background: rgba(0,0,0,0.02); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); background: rgba(0,0,0,0.02); }
        }
        .loading-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.8);
            display: flex; justify-content: center; align-items: center;
            border-radius: 8px; z-index: 10;
            font-size: 1.5rem; color: var(--primary);
            display: none;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 style="font-weight: 600; letter-spacing: -0.5px; margin: 0;">Issue / Return (Real-Time)</h1>
            </div>
            
            <div class="grid-2">
                <!-- Scanner Section -->
                <div class="glass-card" style="position: relative;">
                    <div id="scan-loading" class="loading-overlay"><i class="fas fa-circle-notch fa-spin"></i></div>
                    <h2 style="margin-bottom: 1rem;">Mobile Scanner</h2>
                    
                    <button class="btn" id="btn-scan" onclick="startScanner()" style="width: 100%; padding: 1rem; font-size: 1.1rem; background: var(--primary);"><i class="fas fa-qrcode"></i> Start Camera</button>
                    
                    <div id="reader" style="width:100%; height:auto; min-height:300px; display:none; margin-top: 1rem;"></div>
                    <button class="btn btn-danger" id="btn-stop-scan" style="display:none; margin-top: 1rem; width: 100%;" onclick="stopScanner()">Stop Camera</button>
                    
                    <div style="margin-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div id="student-card" style="padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.02);">
                            <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem;">👨‍🎓 Scanned Student</h3>
                            <p><b>Name:</b> <span id="student-name" style="color: var(--primary);">--</span></p>
                            <p style="margin-top: 0.5rem;"><b>USN:</b> <code id="student-usn">--</code></p>
                        </div>
                        <div id="component-card" style="padding: 1rem; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.02);">
                            <h3 style="margin-bottom: 0.5rem; font-size: 1.1rem;">📦 Scanned Component</h3>
                            <p><b>Name:</b> <span id="component-name" style="color: var(--primary);">--</span></p>
                            <p style="margin-top: 0.5rem;"><b>ID:</b> <code id="component-id">--</code></p>
                        </div>
                    </div>
                </div>

                <!-- Action Section -->
                <div class="glass-card">
                    <h2 style="margin-bottom: 1rem;">Smart Actions</h2>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">When both a student and a component are scanned via the mobile app, the system will <b>automatically issue</b> the component. You can also manually return below.</p>
                    
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <button class="btn btn-danger" style="padding: 1.5rem; font-size: 1.2rem;" onclick="processAction('return')">↩️ Manually Return Component</button>
                    </div>
                    
                    <div id="action-msg" style="margin-top: 1.5rem; font-weight: bold; text-align: center; height: 30px; font-size: 1.1rem;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        createSidebar('nav-actions');
        
        // Sound Engine
        function playSound(type = 'success') {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if(!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                if (type === 'success') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'issue') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(1000, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1500, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.2);
                } else {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            } catch(e) {}
        }

        let html5QrcodeScanner = null;
        window.currentStudent = null;
        window.currentComponent = null;

        function startScanner() {
            document.getElementById('reader').style.display = 'block';
            document.getElementById('btn-stop-scan').style.display = 'block';
            document.getElementById('btn-scan').style.display = 'none';
            
            if(!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5Qrcode("reader");
            }
            
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } }, async (decodedText) => {
                // Pause scanner to avoid double scans
                html5QrcodeScanner.pause();
                try {
                    document.getElementById('scan-loading').style.display = 'flex';
                    await apiCall('/scan', 'POST', { qr: decodedText });
                    showMessage("QR validated successfully!", "var(--success)");
                } catch (err) {
                    playSound('error');
                    showMessage(err.message, "var(--danger)");
                } finally {
                    document.getElementById('scan-loading').style.display = 'none';
                    setTimeout(() => html5QrcodeScanner.resume(), 1500); // 1.5s cooldown
                }
            }, () => {}).catch(err => {
                console.error(err);
                alert("Camera access failed. Connect via HTTPS (e.g., ngrok/localtunnel) on your phone.");
            });
        }

        function stopScanner() {
            if(html5QrcodeScanner) {
                html5QrcodeScanner.stop().then(() => {
                    document.getElementById('reader').style.display = 'none';
                    document.getElementById('btn-stop-scan').style.display = 'none';
                    document.getElementById('btn-scan').style.display = 'block';
                }).catch(err => console.error(err));
            }
        }

        // --- WebSocket Setup ---
        let stompClient = null;
        function connectWS() {
            let wsUrl = API_BASE.replace('/api', '/ws');
            if(wsUrl === '/ws') {
                wsUrl = window.location.protocol + '//' + window.location.host + '/ws';
            }
            const socket = new SockJS(wsUrl);
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket for Scans');
                stompClient.subscribe('/topic/scan', function (msg) {
                    handleWSEvent(JSON.parse(msg.body));
                });
            }, function(err) {
                setTimeout(connectWS, 5000);
            });
        }
        connectWS();

        async function handleWSEvent(data) {
            playSound('success');
            if(data.type === 'student') {
                try {
                    const student = await apiCall(`/students/${data.qr}`, 'GET');
                    window.currentStudent = student;
                    document.getElementById('student-name').innerText = student.name;
                    document.getElementById('student-usn').innerText = student.usn;
                    document.getElementById('student-card').classList.add('highlight-anim');
                    setTimeout(() => document.getElementById('student-card').classList.remove('highlight-anim'), 500);
                } catch(e) {}
            } else if(data.type === 'component') {
                try {
                    const component = await apiCall(`/components/${data.qr}`, 'GET');
                    window.currentComponent = component;
                    document.getElementById('component-name').innerText = component.name;
                    document.getElementById('component-id').innerText = component.componentId;
                    document.getElementById('component-card').classList.add('highlight-anim');
                    setTimeout(() => document.getElementById('component-card').classList.remove('highlight-anim'), 500);
                } catch(e) {}
            }
            checkAutoIssue();
        }
        
        async function checkAutoIssue() {
            if (window.currentStudent && window.currentComponent) {
                showMessage("Auto-issuing component...", "var(--warning)");
                try {
                    await apiCall('/issue', 'POST', {
                        student_usn: window.currentStudent.usn,
                        component_id: window.currentComponent.componentId
                    });
                    playSound('issue');
                    showMessage(`Success! ${window.currentComponent.name} automatically issued to ${window.currentStudent.name}.`, "var(--success)");
                    
                    // Clear values after issue
                    setTimeout(() => {
                        window.currentStudent = null;
                        window.currentComponent = null;
                        document.getElementById('student-name').innerText = '--';
                        document.getElementById('student-usn').innerText = '--';
                        document.getElementById('component-name').innerText = '--';
                        document.getElementById('component-id').innerText = '--';
                    }, 3000); // 3 seconds delay to see the success message
                } catch (err) {
                    playSound('error');
                    showMessage(err.message, "var(--danger)");
                }
            }
        }

        async function processAction(action) {
            if(!window.currentStudent || !window.currentComponent) {
                playSound('error');
                showMessage("Please scan both Student and Component QR codes first.", "var(--warning)");
                return;
            }
            
            try {
                await apiCall(`/${action}`, 'POST', {
                    student_usn: window.currentStudent.usn,
                    component_id: window.currentComponent.componentId
                });
                playSound('success');
                showMessage(`Component successfully ${action === 'issue' ? 'issued' : 'returned'}!`, "var(--success)");
                
                // Reset
                window.currentStudent = null;
                window.currentComponent = null;
                document.getElementById('student-name').innerText = '--';
                document.getElementById('student-usn').innerText = '--';
                document.getElementById('component-name').innerText = '--';
                document.getElementById('component-id').innerText = '--';
            } catch (err) {
                playSound('error');
                showMessage(err.message, "var(--danger)");
            }
        }
        
        function showMessage(msg, color) {
            const msgEl = document.getElementById('action-msg');
            msgEl.innerText = msg;
            msgEl.style.color = color;
            // No auto timeout for the success msg so the user can read it if they aren't looking at screen
            if(color === 'var(--danger)' || color === 'var(--warning)') {
                setTimeout(() => { msgEl.innerText = ''; }, 5000);
            }
        }
    </script>
</body>
</html>
