<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ECE Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="glass-card auth-card">
            <div style="text-align: center; margin-bottom: 2.5rem;">
                <div style="width: 64px; height: 64px; background: linear-gradient(135deg, var(--primary), #8b5cf6); border-radius: 16px; margin: 0 auto 1.2rem; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: white; box-shadow: 0 8px 24px rgba(59,130,246,0.35);">
                    <i class="fas fa-microchip"></i>
                </div>
                <h2 style="color: #fff; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: 0.5px;">Admin Portal</h2>
                <div style="color: var(--text-muted); font-size: 0.95rem; font-weight: 500;">ECE Inventory System</div>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-icon-wrapper">
                        <i class="far fa-user"></i>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Password</label>
                    <div class="input-icon-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="btn" style="width: 100%; font-size: 1.05rem;"><i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Access System</button>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            try {
                const res = await apiCall('/auth/login', 'POST', { username, password });
                if(res.success) {
                    localStorage.setItem('adminAuth', 'true');
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {}
        });
    </script>
</body>
</html>
