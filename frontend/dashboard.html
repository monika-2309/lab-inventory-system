<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ECE Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()" style="color: var(--text-main);"><i class="fas fa-bars"></i></button>
                    <h1 style="font-weight: 600; letter-spacing: -0.5px;">Dashboard</h1>
                </div>
                
                <div style="position: relative;">
                    <button class="glass-card" onclick="toggleUserDropdown()" style="padding: 0.6rem 1.2rem; display: flex; align-items: center; gap: 1rem; margin: 0; cursor: pointer; border: none; background: rgba(30, 41, 59, 0.6); color: white;">
                        <div style="font-size: 1.2rem; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #8b5cf6); width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 10px rgba(59,130,246,0.3);">
                            <i class="fas fa-user"></i>
                        </div>
                        <div style="text-align: left;">
                            <div style="font-weight: 600; font-size: 0.9rem;" id="instructor-name">Ramesh</div>
                            <div style="font-size: 0.75rem; color: var(--text-muted);" id="login-time">Login: --</div>
                        </div>
                        <i class="fas fa-chevron-down" style="font-size: 0.8rem; color: var(--text-muted); margin-left: 0.5rem;"></i>
                    </button>
                    
                    <div id="user-dropdown" class="user-dropdown">
                        <div style="padding: 1rem; border-bottom: 1px solid var(--border); text-align: center;">
                            <div style="font-weight: 600; color: white;">Lab Coordinator</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;" id="instructor-edu">Diploma in Electronics</div>
                        </div>
                        <button onclick="logout()" class="danger-text"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                </div>
            </div>
            
            <div class="grid-4" id="stats-container">
                <div class="glass-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3 style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;">Total Devices</h3>
                            <div class="stat-value" id="stat-total">0</div>
                        </div>
                        <div class="stat-icon" style="color: #60a5fa; background: rgba(96, 165, 250, 0.1);"><i class="fas fa-microchip"></i></div>
                    </div>
                </div>
                <div class="glass-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3 style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;">Available</h3>
                            <div class="stat-value" id="stat-avail" style="color: var(--success);">0</div>
                        </div>
                        <div class="stat-icon" style="color: var(--success); background: rgba(16, 185, 129, 0.1);"><i class="fas fa-check-circle"></i></div>
                    </div>
                </div>
                <div class="glass-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3 style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;">Issued</h3>
                            <div class="stat-value" id="stat-issued" style="color: var(--primary);">0</div>
                        </div>
                        <div class="stat-icon" style="color: var(--primary); background: rgba(59, 130, 246, 0.1);"><i class="fas fa-share-square"></i></div>
                    </div>
                </div>
                <div class="glass-card">
                    <div style="display:flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h3 style="color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase;">Late Returns</h3>
                            <div class="stat-value" id="stat-late" style="color: var(--danger);">0</div>
                        </div>
                        <div class="stat-icon" style="color: var(--danger); background: rgba(239, 68, 68, 0.1);"><i class="fas fa-exclamation-triangle"></i></div>
                    </div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem;">
                <div class="glass-card animate-slide-up" style="animation-delay: 0.1s; text-align: center; background: rgba(30, 41, 59, 0.7); border: 2px dashed rgba(245, 158, 11, 0.3);">
                    <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;"><i class="fas fa-user"></i> Pending Student Scan</h3>
                    <div id="pending-student" style="font-size: 1.5rem; font-weight: 600; color: var(--warning); margin-top: 10px; transition: 0.3s;">Waiting...</div>
                </div>
                <div class="glass-card animate-slide-up" style="animation-delay: 0.2s; text-align: center; background: rgba(30, 41, 59, 0.7); border: 2px dashed rgba(59, 130, 246, 0.3);">
                    <h3 style="color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase;"><i class="fas fa-microchip"></i> Pending Component Scan</h3>
                    <div id="pending-component" style="font-size: 1.5rem; font-weight: 600; color: var(--primary); margin-top: 10px; transition: 0.3s;">Waiting...</div>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
                <div class="glass-card animate-slide-up" style="animation-delay: 0.3s;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="font-size: 1.1rem; font-weight: 600;"><i class="fas fa-chart-bar" style="color: var(--primary); margin-right: 8px;"></i> Issued vs Returned</h3>
                    </div>
                    <canvas id="barChart"></canvas>
                </div>
                <div class="glass-card animate-slide-up" style="animation-delay: 0.4s;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                        <h3 style="font-size: 1.1rem; font-weight: 600;"><i class="fas fa-chart-line" style="color: #8b5cf6; margin-right: 8px;"></i> Daily Usage Trend</h3>
                    </div>
                    <canvas id="lineChart"></canvas>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem; margin-bottom: 2rem;">
                <div class="glass-card animate-slide-up" style="animation-delay: 0.5s;">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem; font-weight: 600;"><i class="fas fa-bell" style="color: var(--warning); margin-right: 8px;"></i> Actionable Alerts</h3>
                    <div id="alerts-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        <span style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading alerts...</span>
                    </div>
                </div>
                
                <div class="glass-card animate-slide-up" style="animation-delay: 0.6s;" id="live-activity-card">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.1rem; font-weight: 600;"><i class="fas fa-satellite-dish fa-spin" style="color: #a78bfa; margin-right: 8px;"></i> Live Activity Feed</h3>
                    <div id="activity-container" style="display: flex; flex-direction: column;">
                        <span style="color: var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading activity...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        createSidebar('nav-dashboard');
        
        function toggleUserDropdown() {
            document.getElementById('user-dropdown').classList.toggle('show');
        }

        // Close dropdown when clicking outside
        window.onclick = function(event) {
            if (!event.target.closest('.glass-card') && !event.target.closest('#user-dropdown')) {
                const dropdown = document.getElementById('user-dropdown');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        }

        async function loadStats() {
            try {
                const stats = await apiCall('/dashboard');
                document.getElementById('stat-total').innerText = stats.totalComponents || 0;
                document.getElementById('stat-avail').innerText = stats.availableStock || 0;
                document.getElementById('stat-issued').innerText = stats.issuedComponents || 0;
                document.getElementById('stat-late').innerText = stats.lateReturns || 0;
            } catch (e) {}
        }
        
        let barChart = null;
        let lineChart = null;

        async function loadAnalytics() {
            try {
                const stats = await apiCall('/dashboard/stats');
                
                // Styling Chart Defaults for Dark Theme
                Chart.defaults.color = '#94a3b8';
                Chart.defaults.font.family = "'Poppins', sans-serif";
                
                // Destroy existing charts if they exist
                if (barChart) barChart.destroy();
                if (lineChart) lineChart.destroy();

                const barCtx = document.getElementById('barChart').getContext('2d');
                const gradientIssued = barCtx.createLinearGradient(0, 0, 0, 400);
                gradientIssued.addColorStop(0, 'rgba(59, 130, 246, 0.9)');
                gradientIssued.addColorStop(1, 'rgba(59, 130, 246, 0.2)');
                
                const gradientReturned = barCtx.createLinearGradient(0, 0, 0, 400);
                gradientReturned.addColorStop(0, 'rgba(16, 185, 129, 0.9)');
                gradientReturned.addColorStop(1, 'rgba(16, 185, 129, 0.2)');

                barChart = new Chart(barCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Issued', 'Returned/Late'],
                        datasets: [{
                            label: 'Components',
                            data: [stats.totalIssued, stats.totalReturned],
                            backgroundColor: [gradientIssued, gradientReturned],
                            borderRadius: 6,
                            borderWidth: 0,
                            barThickness: 40
                        }]
                    },
                    options: { 
                        responsive: true, 
                        plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, cornerRadius: 8 } },
                        scales: { 
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false }, ticks: { stepSize: 1 } },
                            x: { grid: { display: false }, border: { display: false } } 
                        }
                    }
                });

                const dates = stats.dailyUsage.map(d => d.date);
                const counts = stats.dailyUsage.map(d => d.count);
                
                const lineCtx = document.getElementById('lineChart').getContext('2d');
                const gradientLine = lineCtx.createLinearGradient(0, 0, 0, 400);
                gradientLine.addColorStop(0, 'rgba(139, 92, 246, 0.5)');
                gradientLine.addColorStop(1, 'rgba(139, 92, 246, 0.0)');

                lineChart = new Chart(lineCtx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [{
                            label: 'Daily Transactions',
                            data: counts,
                            borderColor: '#8b5cf6',
                            borderWidth: 3,
                            backgroundColor: gradientLine,
                            fill: true,
                            tension: 0.4,
                            pointBackgroundColor: '#8b5cf6',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointRadius: 4,
                            pointHoverRadius: 6
                        }]
                    },
                    options: { 
                        responsive: true, 
                        plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(15, 23, 42, 0.9)', padding: 12, cornerRadius: 8 } },
                        scales: { 
                            y: { grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false }, ticks: { stepSize: 1 } },
                            x: { grid: { display: false }, border: { display: false } } 
                        }
                    }
                });
            } catch (e) { console.error('Error loading analytics', e); }
        }

        async function loadAlerts() {
            try {
                const alerts = await apiCall('/dashboard/alerts');
                const container = document.getElementById('alerts-container');
                container.innerHTML = '';
                
                if (alerts.lowStock.length === 0 && alerts.lateReturns.length === 0) {
                    container.innerHTML = '<div style="color: var(--success); padding: 1rem; text-align: center; border: 1px dashed rgba(16,185,129,0.3); border-radius: 12px; background: rgba(16,185,129,0.05);"><i class="fas fa-check-circle" style="font-size: 1.5rem; margin-bottom: 8px; display: block;"></i>All clear! No active alerts.</div>';
                    return;
                }

                alerts.lateReturns.forEach(t => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background: rgba(239, 68, 68, 0.1); border-left: 4px solid var(--danger); padding: 1rem; border-radius: 8px; display: flex; align-items: flex-start; gap: 1rem; transition: transform 0.2s;';
                    div.innerHTML = `<div style="font-size: 1.25rem; color: var(--danger);"><i class="fas fa-exclamation-circle"></i></div><div><div style="font-weight: 600; color: #f87171;">Late Return</div><div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">${t.student.name} (${t.student.usn}) hasn't returned <strong>${t.component.name}</strong></div></div>`;
                    container.appendChild(div);
                });

                alerts.lowStock.forEach(c => {
                    const div = document.createElement('div');
                    div.style.cssText = 'background: rgba(245, 158, 11, 0.1); border-left: 4px solid #f59e0b; padding: 1rem; border-radius: 8px; display: flex; align-items: flex-start; gap: 1rem; transition: transform 0.2s;';
                    div.innerHTML = `<div style="font-size: 1.25rem; color: #fcd34d;"><i class="fas fa-arrow-down"></i></div><div><div style="font-weight: 600; color: #fcd34d;">Low Stock</div><div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;"><strong>${c.name}</strong> (Only ${c.quantity} left)</div></div>`;
                    container.appendChild(div);
                });
            } catch (e) { 
                document.getElementById('alerts-container').innerHTML = '<div style="color: var(--danger);"><i class="fas fa-times-circle"></i> Failed to load alerts</div>';
            }
        }

        async function loadRecentActivity() {
            try {
                const recent = await apiCall('/transactions/recent');
                const container = document.getElementById('activity-container');
                container.innerHTML = '';
                
                if (recent.length === 0) {
                    container.innerHTML = '<div style="color: var(--text-muted); padding: 1rem; text-align: center; border: 1px dashed rgba(255,255,255,0.1); border-radius: 12px;">No activity yet.</div>';
                    return;
                }

                recent.forEach(t => {
                    const documentDate = new Date(t.time).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'});
                    const isIssued = t.message.includes('issued');
                    const actionColor = isIssued ? 'var(--primary)' : 'var(--success)';
                    const icon = isIssued ? 'fa-share-square' : 'fa-reply';
                    
                    const div = document.createElement('div');
                    div.className = 'timeline-item';
                    div.style.cssText = `--primary: ${actionColor};`;
                    div.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                            <div style="font-size: 0.9rem; line-height: 1.4;">
                                ${t.message.replace('issued', `<span style="color: ${actionColor}; font-weight: 500;"><i class="fas ${icon}"></i> issued</span>`).replace('returned', `<span style="color: ${actionColor}; font-weight: 500;"><i class="fas ${icon}"></i> returned</span>`)}
                            </div>
                            <div style="font-size: 0.75rem; color: var(--text-muted); white-space: nowrap;">${documentDate}</div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) { 
                document.getElementById('activity-container').innerHTML = '<div style="color: var(--danger);"><i class="fas fa-times-circle"></i> Failed to load activity</div>';
            }
        }

        // WebSocket for Live Activity
        let stompClient = null;
        function connectWS() {
            let wsUrl = API_BASE.replace('/api', '/ws');
            if(wsUrl === '/ws') {
                wsUrl = window.location.protocol + '//' + window.location.host + '/ws';
            }
            const socket = new SockJS(wsUrl);
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket for Live Activity');
                
                // Subscribe to Scan Events
                stompClient.subscribe('/topic/scan', function (msg) {
                    const data = JSON.parse(msg.body);
                    if (data.type === 'student') {
                        document.getElementById('pending-student').innerText = data.qr;
                        document.getElementById('pending-student').style.color = 'var(--success)';
                        addLiveActivity(`<i class="fas fa-user"></i> Scan: Student QR`, "var(--warning)");
                    } else if (data.type === 'component') {
                        document.getElementById('pending-component').innerText = data.qr;
                        document.getElementById('pending-component').style.color = 'var(--success)';
                        addLiveActivity(`<i class="fas fa-microchip"></i> Scan: Component QR`, "var(--warning)");
                    } else if (data.type === 'auto-issue') {
                        document.getElementById('pending-student').innerText = 'Waiting...';
                        document.getElementById('pending-student').style.color = 'var(--warning)';
                        document.getElementById('pending-component').innerText = 'Waiting...';
                        document.getElementById('pending-component').style.color = 'var(--primary)';
                    }
                });
                
                // Subscribe to Transaction Events
                stompClient.subscribe('/topic/activity', function(msg) {
                    const data = JSON.parse(msg.body);
                    const isIssued = data.message.includes('issued');
                    addLiveActivity(data.message.replace('issued', '<i class="fas fa-share-square"></i> issued').replace('returned', '<i class="fas fa-reply"></i> returned'), isIssued ? "var(--primary)" : "var(--success)");
                    
                    // Refresh stats with a small delay to ensure backend commit
                    setTimeout(() => {
                        loadStats();
                        loadAnalytics();
                        loadAlerts();
                    }, 500);
                });
            }, function(err) {
                setTimeout(connectWS, 5000);
            });
        }

        function addLiveActivity(msg, color) {
            const container = document.getElementById('activity-container');
            if(container.innerHTML.includes('Loading activity') || container.innerHTML.includes('No activity yet')) {
                container.innerHTML = '';
            }
            
            const div = document.createElement('div');
            div.className = 'timeline-item glow-pulse';
            div.style.cssText = `--primary: ${color};`;
            div.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
                    <div style="font-size: 0.9rem; line-height: 1.4; font-weight: 500;">
                        ${msg}
                    </div>
                    <div style="font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; animation: flash 1s;">Live</div>
                </div>
            `;
            container.prepend(div);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const storedName = localStorage.getItem('instructorName') || 'Ramesh';
            let storedTime = localStorage.getItem('loginTime');
            if(!storedTime) {
                storedTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                localStorage.setItem('loginTime', storedTime);
            }
            document.getElementById('instructor-name').innerText = storedName;
            document.getElementById('instructor-edu').innerText = localStorage.getItem('instructorEducation') || 'Diploma in Electronics';
            document.getElementById('login-time').innerText = "Login: " + storedTime;
            
            loadStats();
            loadAnalytics();
            loadAlerts();
            loadRecentActivity();
            connectWS();
        });
    </script>
    <style>
        .glow-pulse { animation: glow 2s ease-out; }
        @keyframes glow { 0% { background: rgba(167, 139, 250, 0.2); } 100% { background: transparent; } }
        @keyframes flash { 0% { color: #a78bfa; } 100% { color: var(--text-muted); } }
    </style>
</body>
</html>
