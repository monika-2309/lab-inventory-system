<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory - ECE Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <h1 style="font-weight: 600; letter-spacing: -0.5px;">Component Inventory</h1>
                </div>
                <button class="btn btn-success" onclick="document.getElementById('addModal').style.display='flex'"><i class="fas fa-plus-circle" style="margin-right: 8px;"></i> Add Component</button>
            </div>
            
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Total</th>
                            <th>Available</th>
                            <th>QR Text</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="inventory-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <div id="addModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div class="glass-card auth-card" style="width: 100%; max-width: 500px;">
            <h2 style="margin-bottom: 1.5rem;">New Component</h2>
            <form id="addComponentForm">
                <div class="form-group">
                    <label>Component Name</label>
                    <input type="text" id="compName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="compQty" class="form-control" min="1" required>
                </div>
                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 2rem;">
                    <button type="button" class="btn" style="background: transparent; border: 1px solid var(--border);" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
                    <button type="submit" class="btn btn-success">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        createSidebar('nav-inventory');
        
        async function loadComponents() {
            try {
                const components = await apiCall('/components');
                let transactions = [];
                try {
                    transactions = await apiCall('/transactions/history');
                } catch (err) {
                    console.log('Could not fetch history, continuing with 0 issued');
                }
                
                const issuedCounts = {};
                transactions.forEach(t => {
                    if (t.status === 'ISSUED' || t.status === 'LATE') {
                        const compId = t.component ? t.component.id : null;
                        if (compId) {
                            issuedCounts[compId] = (issuedCounts[compId] || 0) + 1;
                        }
                    }
                });

                const tbody = document.getElementById('inventory-list');
                tbody.innerHTML = '';
                components.forEach((c, index) => {
                    const availableQuantity = c.quantity || 0;
                    const issuedQuantity = issuedCounts[c.id] || 0;
                    const totalQuantity = availableQuantity + issuedQuantity;

                    const qrPayload = `${BASE_URL}/api/scan?type=component&qr=${c.qrCodeText || ''}`;
                    const qrUrl = `${API_BASE}/qrcode?text=${encodeURIComponent(qrPayload)}`;
                    tbody.innerHTML += `
                        <tr>
                            <td>#${index + 1}</td>
                            <td>${c.name}</td>
                            <td>${totalQuantity}</td>
                            <td><span style="color: ${availableQuantity > 0 ? 'var(--success)' : 'var(--danger)'}; font-weight: bold;">${availableQuantity}</span></td>
                            <td>
                                <code>${c.qrCodeText || ''}</code>
                                <a href="${qrUrl}" target="_blank" style="margin-left:10px; font-size: 0.8rem; color: var(--primary); text-decoration: none;">📥 QR Image</a>
                            </td>
                            <td>
                                <button class="btn btn-danger" style="padding: 0.4rem 0.8rem; font-size: 0.9rem;" onclick="deleteComp(${c.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }
        
        document.getElementById('addComponentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('compName').value;
            const quantity = parseInt(document.getElementById('compQty').value);
            const componentId = 'COMP' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
            try {
                await apiCall('/components', 'POST', { name, quantity, componentId });
                document.getElementById('addModal').style.display = 'none';
                e.target.reset();
                loadComponents();
            } catch (err) {}
        });

        async function deleteComp(id) {
            if(confirm('Are you sure you want to delete this component?')) {
                try {
                    await apiCall(`/components/${id}`, 'DELETE');
                    loadComponents();
                } catch(err) {}
            }
        }
        
        loadComponents();
    </script>
</body>
</html>
