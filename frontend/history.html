<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>History - ECE Inventory System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        <div class="main-content">
            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                <button class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 style="font-weight: 600; letter-spacing: -0.5px; margin: 0;">Transaction Log</h1>
            </div>
            
            <div class="glass-card" style="padding: 0; overflow: hidden;">
                <table>
                    <thead>
                        <tr>
                            <th>Tx ID</th>
                            <th>Student USN</th>
                            <th>Component</th>
                            <th>Issue Time</th>
                            <th>Return Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="history-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        createSidebar('nav-history');
        
        async function loadHistory() {
            try {
                const history = await apiCall('/transactions/history');
                const tbody = document.getElementById('history-list');
                tbody.innerHTML = '';
                
                history.sort((a,b) => b.id - a.id);
                
                history.forEach(t => {
                    const issueTime = new Date(t.issueTime).toLocaleString();
                    const returnTime = t.returnTime ? new Date(t.returnTime).toLocaleString() : '-';
                    
                    let badgeClass = 'issued';
                    if(t.status === 'RETURNED') badgeClass = 'returned';
                    if(t.status === 'LATE') badgeClass = 'late';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td>#${t.id}</td>
                            <td>${t.student.name} <br><small style="color:var(--text-muted);">${t.student.usn}</small></td>
                            <td>${t.component.name}</td>
                            <td>${issueTime}</td>
                            <td>${returnTime}</td>
                            <td><span class="badge ${badgeClass}">${t.status}</span></td>
                        </tr>
                    `;
                });
            } catch (e) {}
        }
        
        loadHistory();

        let stompClient = null;
        function connectWS() {
            let wsUrl = API_BASE.replace('/api', '/ws');
            if(wsUrl === '/ws') {
                wsUrl = window.location.protocol + '//' + window.location.host + '/ws';
            }
            const socket = new SockJS(wsUrl);
            stompClient = Stomp.over(socket);
            stompClient.debug = null;
            stompClient.connect({}, function (frame) {
                console.log('Connected to WebSocket for History Updates');
                stompClient.subscribe('/topic/activity', function(msg) {
                    // Refresh history with a small delay to ensure backend commit
                    setTimeout(() => {
                        loadHistory();
                    }, 500);
                });
            }, function(err) {
                setTimeout(connectWS, 5000);
            });
        }
        document.addEventListener('DOMContentLoaded', connectWS);
    </script>
</body>
</html>
